<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SI Filings Pro — MCA & Statutory Auto-Filler</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      width: 340px;
      background-color: #0f172a;
      color: #e2e8f0;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
    }

    .logo-badge {
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: #0f172a;
      font-weight: bold;
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 6px;
    }

    .title-group h1 {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
    }

    .title-group p {
      font-size: 11px;
      color: #94a3b8;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #94a3b8;
    }

    .dot.connected { background-color: #10b981; }
    .dot.disconnected { background-color: #ef4444; }

    .company-info {
      font-size: 12px;
      border-top: 1px dashed #334155;
      padding-top: 8px;
      margin-top: 8px;
    }

    .company-name {
      font-weight: bold;
      color: #38bdf8;
      word-break: break-word;
    }

    .btn-fill {
      width: 100%;
      padding: 12px;
      background-color: #10b981;
      color: #0f172a;
      font-weight: 700;
      font-size: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-fill:hover {
      background-color: #059669;
    }

    .btn-fill:disabled {
      background-color: #334155;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .footer {
      font-size: 10px;
      color: #64748b;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-badge">SI</div>
    <div class="title-group">
      <h1>SI Filings Pro</h1>
      <p>MCA & Statutory Portal Auto-Filler</p>
    </div>
  </div>

  <div class="card">
    <div class="status-row">
      <span>Desktop App Connection:</span>
      <span class="status-indicator" id="statusIndicator">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Checking...</span>
      </span>
    </div>

    <div class="company-info" id="companyInfo" style="display: none;">
      <div>Approved Filing Loaded:</div>
      <div class="company-name" id="companyNameLabel">-</div>
      <div style="color: #94a3b8; font-size: 11px;" id="fyLabel">-</div>
    </div>
  </div>

  <button class="btn-fill" id="btnAutofill" disabled>
    ⚡ Auto-Fill Current Page
  </button>
  <button id="btnExportDOM" style="width: 100%; margin-top: 6px; padding: 6px; background: #1e293b; color: #94a3b8; border: 1px solid #334155; border-radius: 6px; font-size: 11px; cursor: pointer;">
    📥 Export MCA Page Structure (HTML Diagnostic)
  </button>

  <div class="card" id="auditLogCard" style="display: none; margin-top: 14px; padding: 10px;">
    <div style="font-size: 11px; font-weight: bold; color: #38bdf8; margin-bottom: 6px;">
      📊 Auto-Fill Audit Logs:
    </div>
    <div id="auditLogBox" style="max-height: 160px; overflow-y: auto; font-family: monospace; font-size: 10px; line-height: 1.4; color: #cbd5e1; background: #0f172a; padding: 8px; border-radius: 4px; border: 1px solid #334155; margin-bottom: 8px;">
    </div>
    <button id="btnCopyLogs" style="width: 100%; padding: 6px; background: #334155; color: #e2e8f0; border: none; border-radius: 4px; font-size: 11px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px;">
      📋 Copy Logs to Clipboard
    </button>
  </div>

  <div class="footer">
    Sharp Intell Technologies • SI Filings Pro v1.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
